<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bible Swipe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Navigation Bar -->
    <nav id="navbar">
      <button class="nav-btn" data-view="reader" aria-label="Reader">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>Read</span>
      </button>
      <button class="nav-btn" data-view="library" aria-label="Library">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>Library</span>
      </button>
      <button class="nav-btn" data-view="settings" aria-label="Settings">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <!-- Reader View -->
    <div id="reader-view" class="view active">
      <div class="reader-header">
        <div id="book-selector">
          <select id="book-select"></select>
        </div>
        <div id="page-indicator">Page <span id="current-page">1</span> / <span id="total-pages">1</span></div>
      </div>

      <div id="card-container">
        <div class="swipe-hint" id="swipe-hint">
          <span class="hint-arrow hint-left">&larr; Previous</span>
          <span class="hint-arrow hint-up">&uarr; Bookmark</span>
          <span class="hint-arrow hint-right">Next &rarr;</span>
        </div>
        <!-- Cards are injected here -->
      </div>

      <!-- Highlight toolbar -->
      <div id="highlight-bar">
        <span class="highlight-label">Highlight:</span>
        <button class="hl-btn" data-color="yellow" style="background:#FFE066;" aria-label="Yellow highlight"></button>
        <button class="hl-btn" data-color="green" style="background:#69DB7C;" aria-label="Green highlight"></button>
        <button class="hl-btn" data-color="blue" style="background:#74C0FC;" aria-label="Blue highlight"></button>
        <button class="hl-btn hl-eraser" data-color="none" aria-label="Remove highlight">&#x2715;</button>
      </div>

      <div id="bookmark-toast" class="toast">&#x1F516; Bookmarked!</div>
    </div>

    <!-- Library View -->
    <div id="library-view" class="view">
      <h2 class="view-title">My Library</h2>
      <div class="library-tabs">
        <button class="lib-tab active" data-tab="highlights">Highlights</button>
        <button class="lib-tab" data-tab="bookmarks">Bookmarks</button>
      </div>
      <div id="highlights-list" class="lib-content active"></div>
      <div id="bookmarks-list" class="lib-content"></div>
    </div>

    <!-- Settings View -->
    <div id="settings-view" class="view">
      <h2 class="view-title">Settings</h2>
      <div class="settings-group">
        <div class="setting-row">
          <span class="setting-label">Dark Mode</span>
          <label class="toggle-switch">
            <input type="checkbox" id="dark-mode-toggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Font Size</span>
          <div class="font-size-controls">
            <button id="font-decrease">A-</button>
            <span id="font-size-display">18px</span>
            <button id="font-increase">A+</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">Reading Progress</span>
          <div class="progress-bar-container">
            <div class="progress-bar" id="reading-progress"></div>
          </div>
          <span id="progress-text">0%</span>
        </div>
      </div>
      <div class="settings-group">
        <h3>About</h3>
        <p class="about-text">Bible Swipe — Read the Bible one page at a time. Swipe right to go forward, left to go back, and up to bookmark.</p>
      </div>
    </div>
  </div>

  <script src="bible-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
